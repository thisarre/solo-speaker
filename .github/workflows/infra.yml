name: Infra agent

on:
  repository_dispatch:
    types: [slack-infra]

permissions:
  contents: write

jobs:
  infra:
    runs-on: ubuntu-latest
    env:
      CHANNEL: ${{ github.event.client_payload.channel }}
      THREAD_TS: ${{ github.event.client_payload.thread_ts }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Status (état prod)
        if: github.event.client_payload.action == 'status'
        run: |
          SUMMARY="🩺 *État prod*"
          for u in /fr /en /fr/pricing /fr/login /fr/signup /api/health /sitemap.xml; do
            code=$(curl -s -o /dev/null -m 15 -w "%{http_code}" "https://solospeaker.com$u")
            icon="✅"; [ "$code" != "200" ] && icon="❌"
            SUMMARY="$SUMMARY"$'\n'"$icon $u → $code"
          done
          SUMMARY="$SUMMARY"$'\n'"DB: $(curl -s -m 15 https://solospeaker.com/api/health)"
          bash scripts/slack-notify.sh "$SUMMARY"

      - name: Deploy
        if: github.event.client_payload.action == 'deploy'
        env:
          GH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          gh workflow run deploy.yml --ref main
          bash scripts/slack-notify.sh "🚀 Déploiement déclenché (~2-3 min)."

      - name: Rollback
        if: github.event.client_payload.action == 'rollback'
        env:
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          git config user.name "Solo Speaker Bot"
          git config user.email "bot@solospeaker.com"
          LAST=$(git log -1 --pretty=%s)
          if git revert HEAD --no-edit; then
            git push "https://x-access-token:${GH_DISPATCH_TOKEN}@github.com/${{ github.repository }}" HEAD:main
            bash scripts/slack-notify.sh "$(printf '↩️ Rollback poussé (revert de : %s). Déploiement en cours.' "$LAST")"
          else
            bash scripts/slack-notify.sh "❌ Rollback impossible (conflit). À traiter manuellement."
            exit 1
          fi

      - name: Logs
        if: github.event.client_payload.action == 'logs'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_SSH_KEY" ]; then
            bash scripts/slack-notify.sh "📋 Logs indisponibles : ajoute le secret GitHub *VPS_SSH_KEY* (clé privée du VPS) pour activer cette commande."
            exit 0
          fi
          mkdir -p ~/.ssh && printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps && chmod 600 ~/.ssh/vps
          LOGS=$(ssh -i ~/.ssh/vps -o StrictHostKeyChecking=no -o ConnectTimeout=15 root@72.62.21.211 'docker logs --tail 40 solo-speaker-web-1 2>&1' | tail -c 2500)
          bash scripts/slack-notify.sh "$(printf '📋 *Logs (40 dernières lignes)*\n```\n%s\n```' "$LOGS")"
