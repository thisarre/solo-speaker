name: Site review (marketing -> veille + améliorations)

# Revue mensuelle du site par l'agent Marketing : parcourt toutes les pages
# publiques (sitemap), fait une veille des tendances/concurrents du créneau
# (coach IA / prompteur / préparation de prise de parole) et propose des
# améliorations visuel / wording / features / stack. Jusqu'à 3 propositions
# actionnables avec bouton "Lancer" -> pipeline feature (spec à valider).

on:
  schedule:
    - cron: "0 8 3 * *" # le 3 de chaque mois, 08:00 UTC
  workflow_dispatch: {}
  repository_dispatch:
    types: [site-review]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      REPORT_CHANNEL: ${{ vars.SLACK_MARKETING_CHANNEL || vars.SLACK_ANALYTICS_CHANNEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Liste des pages publiques (sitemap)
        run: |
          curl -s https://solospeaker.com/sitemap.xml | grep -oE '<loc>[^<]+</loc>' | sed 's/<[^>]*>//g' > "$RUNNER_TEMP/pages.txt"
          wc -l "$RUNNER_TEMP/pages.txt"; cat "$RUNNER_TEMP/pages.txt"

      - name: Revue du site + veille
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -o pipefail
          npm install -g @anthropic-ai/claude-code
          PAGES=$(cat "$RUNNER_TEMP/pages.txt")
          PROMPT="Tu es l'agent Marketing de Solo Speaker Studio (solospeaker.com — SaaS IA de preparation, repetition et delivery de prises de parole : orateurs, pasteurs, formateurs, fondateurs. Essai gratuit 5 talks, plans Studio/Pro/Team. Stack Next.js 16 + Supabase + Stripe + OpenAI/Deepgram/ElevenLabs).

          Mission en 3 temps :
          1) REVUE DU SITE — visite (WebFetch) les pages publiques ci-dessous et evalue wording, clarte de la proposition de valeur, coherence FR/EN, parcours vers signup :
          $PAGES
          2) VEILLE — cherche (WebSearch) ce qui se fait en ce moment sur le creneau : concurrents (teleprompter apps, AI speech coach, outils orateurs/pasteurs), tendances design de landing SaaS 2026, attentes IA. 3-4 recherches max.
          3) AMELIORATIONS — croise revue + veille + code (lecture seule) et propose des ameliorations classees en 4 axes : *Visuel*, *Wording*, *Features*, *Stack*.

          Format de sortie, en francais, markdown Slack simple (pas de titres #), CONCIS (~1800 caracteres hors lignes IMPROVE) :
          *Revue* : 3-5 constats concrets sur les pages (cite la page).
          *Veille* : 2-3 signaux marche/concurrence dates et sources.
          *Ameliorations* : liste courte par axe.
          Puis AU MAXIMUM 3 lignes commencant EXACTEMENT par 'IMPROVE: ' — les ameliorations les plus rentables, chacune une consigne autonome et actionnable pour un agent developpeur (~200 caracteres max, contexte inclus). Priorise ce qui rapproche un visiteur du signup."
          printf '%s' "$PROMPT" | claude -p \
            --dangerously-skip-permissions \
            --allowedTools "Read,Glob,Grep,WebFetch,WebSearch" \
            --model claude-sonnet-4-6 \
            --max-turns 40 | tee "$RUNNER_TEMP/review.txt"

      - name: Post revue + boutons Lancer
        if: always()
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ] || [ -z "$REPORT_CHANNEL" ]; then exit 0; fi
          OUT="$RUNNER_TEMP/review.txt"
          REPORT=$(grep -v '^IMPROVE: ' "$OUT" 2>/dev/null | head -c 2800)
          [ -z "$REPORT" ] && REPORT="(revue indisponible — verifier le run site-review)"
          mapfile -t IMPROVES < <(grep '^IMPROVE: ' "$OUT" 2>/dev/null | sed 's/^IMPROVE: //' | head -3)

          HEADER="🧭 *Revue du site + veille* — $(date -u +%d/%m/%Y)"
          BLOCKS=$(jq -n --arg h "$HEADER" --arg r "$REPORT" '[
            {type:"section", text:{type:"mrkdwn", text:$h}},
            {type:"section", text:{type:"mrkdwn", text:$r}}
          ]')

          if [ "${#IMPROVES[@]}" -gt 0 ]; then
            LIST=""
            BUTTONS='[]'
            for i in "${!IMPROVES[@]}"; do
              N=$((i+1))
              IMP=$(printf '%s' "${IMPROVES[$i]}" | head -c 1900)
              LIST="$LIST\n*$N.* $IMP"
              BUTTONS=$(jq --arg n "🚀 Lancer $N" --arg v "$IMP" '. + [{type:"button", text:{type:"plain_text", text:$n}, action_id:"improve_approve", value:$v}]' <<< "$BUTTONS")
            done
            LIST_TEXT=$(printf '💡 *Améliorations proposées* (clic = spec à valider avant tout code) :%b' "$LIST")
            BLOCKS=$(jq --arg t "$LIST_TEXT" --argjson btns "$BUTTONS" '. + [
              {type:"section", text:{type:"mrkdwn", text:$t}},
              {type:"actions", elements:$btns}
            ]' <<< "$BLOCKS")
          fi

          PAYLOAD=$(jq -n --arg ch "$REPORT_CHANNEL" --arg txt "$HEADER" --argjson blocks "$BLOCKS" '{channel:$ch, text:$txt, blocks:$blocks}')
          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "content-type: application/json; charset=utf-8" \
            --data "$PAYLOAD" | jq -r 'if .ok then "posted" else "slack error: \(.error)" end'
