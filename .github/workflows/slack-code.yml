name: Slack coding agent (Dev)

on:
  repository_dispatch:
    types: [slack-code]

permissions:
  contents: write
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      PROMPT: ${{ github.event.client_payload.prompt }}
      CHANNEL: ${{ github.event.client_payload.channel }}
      THREAD_TS: ${{ github.event.client_payload.thread_ts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Slack — démarrage
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: bash scripts/slack-notify.sh "🤖 *Agent Dev* démarré. J'analyse le code et je code ta tâche…"

      - name: Run Claude Code on the task
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm install -g @anthropic-ai/claude-code
          # No pipefail: if the agent hits max-turns it still leaves partial work → a PR opens
          # for review; a real auth failure produces no file changes → "aucun changement" (no empty PR).
          printf '%s' "$PROMPT" | claude -p \
            --dangerously-skip-permissions \
            --allowedTools "Edit,Write,Read,Bash,Glob,Grep" \
            --model claude-sonnet-4-6 \
            --max-turns 100 | tee "$RUNNER_TEMP/claude-output.log"

      - name: Slack — code terminé
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: bash scripts/slack-notify.sh "✍️ Code terminé. Je lance les vérifications (tests, typecheck, build)…"

      - name: Detect changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Validate (tests, typecheck, build)
        id: validate
        if: steps.changes.outputs.changed == 'true'
        run: |
          set +e
          npm test > /dev/null 2>&1;        echo "test=$?"  >> "$GITHUB_OUTPUT"
          npm run typecheck > /dev/null 2>&1; echo "tc=$?"   >> "$GITHUB_OUTPUT"
          npm run build > /dev/null 2>&1;    echo "build=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Slack — vérifications
        if: steps.changes.outputs.changed == 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          T: ${{ steps.validate.outputs.test }}
          TC: ${{ steps.validate.outputs.tc }}
          B: ${{ steps.validate.outputs.build }}
        run: bash scripts/slack-notify.sh "🧪 Vérifications — tests=$T · typecheck=$TC · build=$B. J'ouvre la PR…"

      - name: Commit, push and open PR
        id: pr
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          git config user.name "Solo Speaker Bot"
          git config user.email "bot@solospeaker.com"
          BRANCH="slack/${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "slack: $(printf '%s' "$PROMPT" | head -c 70)"
          git push origin "$BRANCH"
          URL="$(gh pr create --base main --head "$BRANCH" --title "$(printf '%s' "$PROMPT" | head -c 70)" --body "$(printf 'Tache Slack:\n\n> %s\n\nValidation: tests=%s typecheck=%s build=%s\n\n<!-- slack-context channel=%s thread=%s -->' "$PROMPT" "${{ steps.validate.outputs.test }}" "${{ steps.validate.outputs.tc }}" "${{ steps.validate.outputs.build }}" "$CHANNEL" "$THREAD_TS")")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "number=$(gh pr view "$BRANCH" --json number -q .number)" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Notify Slack (QA pending, no merge button yet)
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CHANGED: ${{ steps.changes.outputs.changed }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          if [ "$CHANGED" = "false" ]; then
            bash scripts/slack-notify.sh "$(printf 'ℹ️ Tâche terminée, aucun changement de code produit.\n\n> %s' "$PROMPT")"
          elif [ -n "$PR_URL" ]; then
            bash scripts/slack-notify.sh "$(printf '🤖 PR ouverte : %s\n🔎 *QA en cours*… le bouton Merger apparaîtra après le verdict.' "$PR_URL")"
          else
            bash scripts/slack-notify.sh "❌ La tâche a échoué avant l'ouverture de la PR. Voir les logs GitHub Actions."
          fi
