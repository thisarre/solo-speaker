name: Weekly insights (analytics -> improvements)

# Rapport analytics hebdomadaire dans #analytics : lecture PostHog + jusqu'à 3
# améliorations proposées, chacune avec un bouton "Lancer" qui envoie la
# proposition dans le pipeline feature (refine -> spec à valider -> Dev -> QA).
# Le bouton est le human-gate : rien ne se lance sans clic.

on:
  schedule:
    - cron: "30 7 * * 1" # lundi 07:30 UTC
  workflow_dispatch: {}
  repository_dispatch:
    types: [weekly-insights]

permissions:
  contents: read

jobs:
  insights:
    runs-on: ubuntu-latest
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      ANALYTICS_CHANNEL: ${{ vars.SLACK_ANALYTICS_CHANNEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Pull PostHog data (week over week)
        env:
          POSTHOG_API_HOST: ${{ vars.POSTHOG_API_HOST }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
        run: |
          HOST="${POSTHOG_API_HOST:-https://us.posthog.com}"
          hog() {
            [ -z "$POSTHOG_PERSONAL_API_KEY" ] && { echo "n/a"; return; }
            curl -s -m 30 -X POST "$HOST/api/projects/$POSTHOG_PROJECT_ID/query/" \
              -H "Authorization: Bearer $POSTHOG_PERSONAL_API_KEY" -H "content-type: application/json" \
              --data "$(jq -n --arg q "$1" '{query:{kind:"HogQLQuery", query:$q}}')" | jq -c '.results // "n/a"'
          }
          {
            echo "Semaine courante (7j) vs precedente (7-14j):"
            echo "Pageviews 7j: $(hog "SELECT count() FROM events WHERE event='\$pageview' AND timestamp > now() - INTERVAL 7 DAY")"
            echo "Pageviews 7-14j: $(hog "SELECT count() FROM events WHERE event='\$pageview' AND timestamp BETWEEN now() - INTERVAL 14 DAY AND now() - INTERVAL 7 DAY")"
            echo "Signups 7j: $(hog "SELECT count() FROM events WHERE event='user_signed_up' AND timestamp > now() - INTERVAL 7 DAY")"
            echo "Signups 7-14j: $(hog "SELECT count() FROM events WHERE event='user_signed_up' AND timestamp BETWEEN now() - INTERVAL 14 DAY AND now() - INTERVAL 7 DAY")"
            echo "Onboarding completes 7j: $(hog "SELECT count() FROM events WHERE event='onboarding_completed' AND timestamp > now() - INTERVAL 7 DAY")"
            echo "Exceptions 7j: $(hog "SELECT count() FROM events WHERE event='\$exception' AND timestamp > now() - INTERVAL 7 DAY")"
            echo "Top pages 7j: $(hog "SELECT properties.\$pathname AS p, count() AS c FROM events WHERE event='\$pageview' AND timestamp > now() - INTERVAL 7 DAY GROUP BY p ORDER BY c DESC LIMIT 10")"
            echo "Top events 7j: $(hog "SELECT event, count() AS c FROM events WHERE timestamp > now() - INTERVAL 7 DAY GROUP BY event ORDER BY c DESC LIMIT 12")"
            echo "Locales 7j: $(hog "SELECT properties.\$browser_language AS l, count() AS c FROM events WHERE event='\$pageview' AND timestamp > now() - INTERVAL 7 DAY GROUP BY l ORDER BY c DESC LIMIT 5")"
          } > "$RUNNER_TEMP/data.txt"
          cat "$RUNNER_TEMP/data.txt"

      - name: Analyse + propositions d'amélioration
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -o pipefail
          npm install -g @anthropic-ai/claude-code
          DATA=$(cat "$RUNNER_TEMP/data.txt")
          PROMPT="Tu es l'agent analytics de Solo Speaker (SaaS IA de preparation de prises de parole, essai gratuit 5 talks puis Studio/Pro/Team). Donnees PostHog de la semaine :
          $DATA

          Produis le rapport hebdomadaire en francais, markdown Slack simple (pas de titres #), CONCIS :
          1) *Chiffres de la semaine* : lecture week-over-week en 4-6 lignes max.
          2) *Signal notable* : 1-2 observations (anomalie, opportunite, page qui monte...).
          3) Puis, en te basant sur ces donnees ET sur le code (lecture seule autorisee), propose AU MAXIMUM 3 ameliorations concretes de l'app. Chacune sur UNE ligne commencant EXACTEMENT par 'IMPROVE: ' suivie d'une consigne autonome et actionnable pour un agent developpeur (contexte inclus, ~200 caracteres max). Ne propose une amelioration QUE si les donnees la justifient; s'il n'y a pas assez de volume, propose plutot l'instrumentation manquante en IMPROVE.
          Total hors lignes IMPROVE : ~1200 caracteres max."
          printf '%s' "$PROMPT" | claude -p \
            --dangerously-skip-permissions \
            --allowedTools "Read,Glob,Grep" \
            --model claude-sonnet-4-6 \
            --max-turns 15 | tee "$RUNNER_TEMP/insights.txt"

      - name: Post report + boutons Lancer to #analytics
        if: always()
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ] || [ -z "$ANALYTICS_CHANNEL" ]; then exit 0; fi
          OUT="$RUNNER_TEMP/insights.txt"
          REPORT=$(grep -v '^IMPROVE: ' "$OUT" 2>/dev/null | head -c 2800)
          [ -z "$REPORT" ] && REPORT="(rapport indisponible cette semaine — verifier le run weekly-insights)"
          mapfile -t IMPROVES < <(grep '^IMPROVE: ' "$OUT" 2>/dev/null | sed 's/^IMPROVE: //' | head -3)

          HEADER="📈 *Rapport analytics hebdo* — $(date -u +%d/%m/%Y)"
          BLOCKS=$(jq -n --arg h "$HEADER" --arg r "$REPORT" '[
            {type:"section", text:{type:"mrkdwn", text:$h}},
            {type:"section", text:{type:"mrkdwn", text:$r}}
          ]')

          if [ "${#IMPROVES[@]}" -gt 0 ]; then
            LIST=""
            BUTTONS='[]'
            for i in "${!IMPROVES[@]}"; do
              N=$((i+1))
              IMP=$(printf '%s' "${IMPROVES[$i]}" | head -c 1900)
              LIST="$LIST\n*$N.* $IMP"
              BUTTONS=$(jq --arg n "🚀 Lancer $N" --arg v "$IMP" '. + [{type:"button", text:{type:"plain_text", text:$n}, action_id:"improve_approve", value:$v}]' <<< "$BUTTONS")
            done
            LIST_TEXT=$(printf '💡 *Améliorations proposées* (clic = spec à valider avant tout code) :%b' "$LIST")
            BLOCKS=$(jq --arg t "$LIST_TEXT" --argjson btns "$BUTTONS" '. + [
              {type:"section", text:{type:"mrkdwn", text:$t}},
              {type:"actions", elements:$btns}
            ]' <<< "$BLOCKS")
          fi

          PAYLOAD=$(jq -n --arg ch "$ANALYTICS_CHANNEL" --arg txt "$HEADER" --argjson blocks "$BLOCKS" '{channel:$ch, text:$txt, blocks:$blocks}')
          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "content-type: application/json; charset=utf-8" \
            --data "$PAYLOAD" | jq -r 'if .ok then "posted" else "slack error: \(.error)" end'
