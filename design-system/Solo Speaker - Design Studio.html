<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Solo Speaker — Design Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;650;700&family=Geist+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="studio.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>html,body{margin:0;height:100%;}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="directions.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;

function App() {
  return (
    <DesignCanvas title="Solo Speaker — Design Studio">
      <DCSection id="directions" title="01 · Directions visuelles" subtitle="Six déclinaisons « studio » — minimales, sans-serif, peu de couleur. Comparez les températures de gris, l'accent et les rayons.">
        <DCArtboard id="dir-a" label="A · Studio Light — Geist + indigo" width={400} height={310}><DirA /></DCArtboard>
        <DCArtboard id="dir-b" label="B · Studio Dark — Geist + indigo" width={400} height={310}><DirB /></DCArtboard>
        <DCArtboard id="dir-c" label="C · Soft Graphite — Manrope + teal, ombres douces" width={400} height={310}><DirC /></DCArtboard>
        <DCArtboard id="dir-d" label="D · Mono Ink — zéro couleur, hiérarchie par la graisse" width={400} height={310}><DirD /></DCArtboard>
        <DCArtboard id="dir-e" label="E · Slate Pro — bleu électrique, rayons serrés" width={400} height={310}><DirE /></DCArtboard>
        <DCArtboard id="dir-f" label="F · Warm Studio — Space Grotesk + ambre" width={400} height={310}><DirF /></DCArtboard>
      </DCSection>

      <DCSection id="dashboard" title="02 · Dashboard" subtitle="Direction A appliquée — sidebar discrète, carte « Reprendre », récents. Thème clair + sombre (toggle en V1).">
        <DCArtboard id="db-light" label="Dashboard — clair" width={1280} height={832}><Dashboard theme="th-light" /></DCArtboard>
        <DCArtboard id="db-dark" label="Dashboard — sombre" width={1280} height={832}><Dashboard theme="th-dark" /></DCArtboard>
      </DCSection>

      <DCSection id="editor" title="03 · Éditeur" subtitle="Document central façon Notion/Descript, plan chronométré à gauche, assistant IA intégré à droite — jamais séparé du flux d'écriture.">
        <DCArtboard id="ed-light" label="Éditeur — section en cours de génération" width={1280} height={860}><Editor /></DCArtboard>
      </DCSection>

      <DCSection id="speaking" title="04 · Speaking Mode" subtitle="Plein écran, zéro distraction — ligne courante en blanc pur, repère fixe à gauche, contrôles en pilule, repliables.">
        <DCArtboard id="sp" label="Speaking Mode — auto-scroll actif" width={1280} height={800}><Speaking /></DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
